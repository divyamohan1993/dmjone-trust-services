name: deploy

# Push to main → build both images to Artifact Registry and deploy to Cloud Run.
# Auth is keyless via Workload Identity Federation (no service-account key in the
# repo). The deployer SA is scoped to the `trust` AR repo + the two services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the WIF OIDC token

env:
  PROJECT: dmjone
  REGION: asia-east1
  AR: asia-east1-docker.pkg.dev/dmjone/trust
  WIF_PROVIDER: projects/107722137045/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER: trust-deployer@dmjone.iam.gserviceaccount.com

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build + push images
        run: |
          docker build -f infra/Dockerfile.issuer -t "$AR/issuer:latest" .
          docker build -f infra/Dockerfile.verify -t "$AR/verify:latest" .
          docker push "$AR/issuer:latest"
          docker push "$AR/verify:latest"

      - name: Deploy issuer
        run: |
          gcloud run deploy issuer \
            --image="$AR/issuer:latest" --region="$REGION" --project="$PROJECT" \
            --service-account="issuer-sa@$PROJECT.iam.gserviceaccount.com" \
            --min-instances=0 --max-instances=2 --cpu=1 --memory=1Gi \
            --concurrency=4 --timeout=120 --allow-unauthenticated \
            --set-env-vars="SERVICE_ROLE=issuer,DATA_BACKEND=firestore,GCP_PROJECT_ID=$PROJECT,GCP_REGION=$REGION,FIRESTORE_DATABASE_ID=trust,ISSUER_PUBLIC_URL=https://issue.dmj.one,VERIFY_PUBLIC_URL=https://verify.dmj.one,WEBAUTHN_RP_ID=issue.dmj.one,WEBAUTHN_RP_NAME=dmj.one Trust Services,WEBAUTHN_ORIGIN=https://issue.dmj.one,ANCHOR_GITHUB_REPO=divyamohan1993/dmjone-trust-anchor,SESSION_SECRET=${{ secrets.TRUST_SESSION_SECRET }},ADMIN_SETUP_TOKEN=${{ secrets.TRUST_ADMIN_SETUP_TOKEN }},ANCHOR_GITHUB_TOKEN=${{ secrets.TRUST_ANCHOR_GITHUB_TOKEN }}" \
            --set-secrets="MASTER_ENCRYPTION_KEY=master-encryption-key:latest,SIGNATURE_PNG_BASE64=signature-png:latest" # pragma: allowlist secret
            # session-secret/admin-setup-token/anchor-github-token were one-time migrated from SM
            # mounts to the literal env vars above (Cloud Run cannot switch an env var's type in a
            # single deploy; it was done as detach-then-set across two revisions). They stay literal
            # here so this deploy is literal->literal. master + signature stay SM-mounted;
            # trust_private stays in SM (keys.ts env-first TRUST_PRIVATE_B64, SM fallback; not set).

      - name: Deploy verify
        run: |
          gcloud run deploy verify \
            --image="$AR/verify:latest" --region="$REGION" --project="$PROJECT" \
            --service-account="verify-sa@$PROJECT.iam.gserviceaccount.com" \
            --min-instances=0 --max-instances=4 --cpu=1 --memory=512Mi \
            --concurrency=80 --timeout=60 --allow-unauthenticated \
            --set-env-vars="SERVICE_ROLE=verify,DATA_BACKEND=firestore,GCP_PROJECT_ID=$PROJECT,GCP_REGION=$REGION,FIRESTORE_DATABASE_ID=trust,ISSUER_PUBLIC_URL=https://issue.dmj.one,VERIFY_PUBLIC_URL=https://verify.dmj.one,SESSION_SECRET=${{ secrets.TRUST_SESSION_SECRET }}"
            # verify holds NO mounted secret: SESSION_SECRET is a literal env var (one-time migrated
            # from its SM mount) and verify reads the public trust_public via the SM API (verify-sa IAM).

      - name: Smoke-check health
        run: |
          for svc in issuer verify; do
            url=$(gcloud run services describe $svc --region="$REGION" --project="$PROJECT" --format='value(status.url)')
            echo "$svc: $url"
            curl -fsS "$url/health" && echo " OK"
          done
