name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: package.json `packageManager` is the single
      # source of truth (specifying both fails pnpm/action-setup@v4).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: tsc -b emits the workspace .d.ts files that the per-package
      # `tsc --noEmit` typecheck (and the tests) resolve against.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      # render + e2e launch headless Chromium via puppeteer-core; point it at the
      # Google Chrome preinstalled on the runner (same mechanism as the Docker image).
      - name: Test
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
          echo "Chrome: ${PUPPETEER_EXECUTABLE_PATH:-NOT FOUND}"
          pnpm -r --if-present test

      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level high
        continue-on-error: true

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
