name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: package.json `packageManager` is the single
      # source of truth (specifying both fails pnpm/action-setup@v4).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # render + e2e tests launch headless Chromium; pnpm v10 blocks puppeteer's
      # auto-download, so fetch a browser explicitly into puppeteer's cache.
      - name: Install Chromium for tests
        run: pnpm --filter @dmjone/render exec puppeteer browsers install chrome

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Test
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm -r build

      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level high
        continue-on-error: true

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
